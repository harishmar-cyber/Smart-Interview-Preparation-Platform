{% extends 'base.html' %}

{% block title %}{{ 'Edit' if question else 'Add' }} HR Question | SmartPrep{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 900px;">
    <a href="{{ url_for('admin.hr_list') }}" class="small text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i> Back to HR questions
    </a>
    <div class="mt-3 mb-4">
        <h1 class="h3 fw-bold mb-1">{{ 'Edit' if question else 'Add' }} HR question</h1>
        <p class="text-muted mb-0">Provide a clear prompt and optional preparation guidance.</p>
    </div>

    <form method="POST" class="card-modern p-4">
        <div class="mb-3">
            <label for="question_text" class="form-label fw-semibold">Question</label>
            <textarea class="form-control" id="question_text" name="question_text" rows="3" required maxlength="2000">{{ question.question_text if question else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label fw-semibold">Category</label>
            <select class="form-select" id="category" name="category">
                {% set current_category = question.category if question else 'Behavioral' %}
                {% for category in ['Behavioral', 'Situational', 'Career Goals', 'Strengths & Weaknesses'] %}
                <option value="{{ category }}" {{ 'selected' if current_category == category else '' }}>{{ category }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="answer_tips" class="form-label fw-semibold">Answer tips</label>
            <textarea class="form-control" id="answer_tips" name="answer_tips" rows="3">{{ question.answer_tips if question else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label for="example_answer" class="form-label fw-semibold">Example answer</label>
            <textarea class="form-control" id="example_answer" name="example_answer" rows="4">{{ question.example_answer if question else '' }}</textarea>
        </div>
        <div class="mb-4">
            <label for="star_framework_guide" class="form-label fw-semibold">STAR framework guide</label>
            <textarea class="form-control" id="star_framework_guide" name="star_framework_guide" rows="3">{{ question.star_framework_guide if question else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Save changes' if question else 'Create question' }}</button>
            <a href="{{ url_for('admin.hr_list') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
